services:
  library-db:
    image: postgres:16
    container_name: library-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - library_db_data:/var/lib/postgresql/data

volumes:
  library_db_data:
